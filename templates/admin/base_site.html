{% extends "admin/base.html" %} {% load static %} {% block title %}{{ title }} |
Idle Admin{% endblock %} {% block extrastyle %} {{ block.super }}

<style>
  /* ==============================
   IDLE ADMIN — LIGHT RED UI
============================== */

  /* COLORS (LIGHT RED THEME) */
  :root {
    --primary: #ef4444; /* light red */
    --primary-dark: #dc2626;
    --primary-light: #fee2e2;

    --bg: #f5f5f5;
    --white: #ffffff;
    --border: #e5e7eb;

    --text: #1f2937;
    --text-light: #6b7280;
  }

  /* GLOBAL */
  body {
    background: var(--bg) !important;
    font-family: "DM Sans", sans-serif !important;
    font-size: 13px !important;
    color: var(--text);
  }

  /* HEADER */
  #header {
    background: var(--white) !important;
    border-bottom: 1px solid var(--border);
    height: 54px;
    padding: 0 20px;
  }

  #branding h1 {
    font-size: 14px !important;
    font-weight: 700;
  }

  #branding h1 a {
    color: var(--primary) !important;
  }

  /* USER TOOLS */
  #user-tools {
    font-size: 10px !important;
  }

  /* SIDEBAR */
  #nav-sidebar {
    width: 210px;
    background: var(--white);
    border-right: 1px solid var(--border);
    padding: 10px;
  }

  /* SEARCH */
  #nav-sidebar input {
    font-size: 12px;
    padding: 7px;
    border-radius: 10px;
  }

  /* SECTION TITLE */
  #nav-sidebar caption {
    background: var(--primary-light) !important;
    color: var(--primary-dark) !important;
    font-weight: 700;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 10px;
  }

  /* NAV ITEMS */
  #nav-sidebar a {
    display: block;
    padding: 7px 10px;
    margin-bottom: 6px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 500;
    color: var(--primary-dark);
    background: var(--white);
    border: 1px solid var(--border);
  }

  /* HOVER */
  #nav-sidebar a:hover {
    background: var(--primary-light);
    color: var(--primary);
    border-color: var(--primary);
  }

  /* ACTIVE */
  #nav-sidebar .current-app a,
  #nav-sidebar .selected a {
    background: var(--primary) !important;
    color: white !important;
    border-color: var(--primary);
  }

  /* ADD BUTTON (SIDEBAR) */
  #nav-sidebar td.addlink a {
    background: var(--primary);
    color: white;
    font-size: 10px;
    font-weight: 700;
    border-radius: 10px;
    padding: 5px 9px;
  }

  /* MAIN CONTENT */
  #content {
    padding: 25px;
  }

  /* TITLE */
  #content h1 {
    font-size: 22px !important;
    font-weight: 700;
    margin-bottom: 18px;
  }

  /* OBJECT BUTTON */
  .object-tools {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 12px;
  }

  .object-tools a {
    background: var(--primary);
    color: white !important;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
  }

  .object-tools a:hover {
    background: var(--primary-dark);
  }

  /* ACTION BAR */
  .actions {
    background: var(--white);
    padding: 10px;
    border-radius: 14px;
    border: 1px solid var(--border);
  }

  /* TABLE CONTAINER */
  #result_list {
    background: var(--white);
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--border);
  }

  /* TABLE HEAD */
  #result_list thead th {
    font-size: 10px;
    font-weight: 700;
    padding: 10px;
  }

  /* TABLE BODY */
  #result_list tbody td,
  #result_list tbody th {
    font-size: 12px;
    padding: 12px;
  }

  /* ROW HOVER */
  #result_list tbody tr:hover {
    background: #fef2f2;
  }

  /* BUTTONS */
  input[type="submit"],
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 11px;
  }

  input[type="submit"]:hover {
    background: var(--primary-dark);
  }

  /* FORM */
  input,
  select,
  textarea {
    border: 1px solid var(--border);
    padding: 7px;
    border-radius: 12px;
    font-size: 12px;
  }

  input:focus {
    border-color: var(--primary);
    outline: none;
  }

  /* CHECKBOX */
  input[type="checkbox"] {
    accent-color: var(--primary);
  }
</style>
{% endblock %}
